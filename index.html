<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتاق فرار ریاضی - پایه هفتم</title>
    <style>
        :root {
            --primary: #f59e0b;
            --bg: #121214;
            --card-bg: #1f1f23;
            --text: #fafafa;
        }

        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: center;
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 2px solid #3f3f46;
        }

        header {
            text-align: center;
            border-bottom: 2px dashed #3f3f46;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        header h1 {
            color: #fbbf24;
            font-size: 1.5rem;
            margin: 0 0 8px 0;
        }

        .meta-box {
            background: #27272a;
            padding: 8px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a1a1aa;
            font-weight: bold;
        }

        .progress-bar {
            height: 10px;
            background: #121214;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #3f3f46;
            margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #d97706);
            transition: width 0.4s ease;
        }

        .step-panel {
            display: none;
        }

        .step-panel.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .card {
            background: #121214;
            border: 1px solid #3f3f46;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        /* استایل جدید برای گزینه‌های پاسخ‌دهی کارتی */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            background: #27272a;
            border: 2px solid #52525b;
            color: white;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .option-btn:hover {
            border-color: #fbbf24;
            background: #3f3f46;
            transform: translateY(-3px);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: #27272a;
            border: 2px solid #52525b;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: #121214;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(245,158,11,0.3);
        }

        .feedback {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            display: none;
            font-weight: bold;
            line-height: 1.6;
            text-align: center;
        }

        .feedback.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .feedback.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #121214;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border: 1px solid #3f3f46;
            text-align: center;
        }

        th {
            background: #3f3f46;
            color: #fbbf24;
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>🔐 اتاق فرار ریاضی (فصل اول)</h1>
        <div class="meta-box">
            <span>چالش راهبردهای حل مسئله</span>
            <span>تدوین‌گران: مهدی حسینی و سمیه حسینی</span>
        </div>
    </header>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- مرحله ورود -->
    <div id="step-auth" class="step-panel active">
        <div class="card" style="text-align: center;">
            <h2>🕵️‍♂️ ورود به اتاق فرار معماها</h2>
            <p style="color: #a1a1aa; margin-bottom: 20px;">نام و کلاس خود را برای دریافت کلیدها وارد کنید:</p>
            <input type="text" id="studentName" placeholder="نام و نام خانوادگی...">
            <input type="text" id="className" placeholder="نام کلاس (مثلاً: هفتم ۱)..." style="margin-top: 10px;">
            <button class="btn" style="margin-top: 15px;" onclick="startGame()">شروع ماجراجویی 🚀</button>
        </div>
    </div>

    <!-- پنل معماها با پاسخ‌دهی کارتی -->
    <div id="step-game" class="step-panel">
        <div class="card">
            <h3 id="roomTitle" style="color: #fbbf24; margin-top:0;"></h3>
            <p id="roomDesc" style="font-size: 1.1rem; line-height: 1.8; color: #e4e4e7;"></p>
            
            <!-- کارهای گرافیکی انتخاب پاسخ به جای کادر متنی -->
            <div id="optionsContainer" class="options-grid"></div>

            <div id="feedback" class="feedback"></div>
        </div>
        <button id="nextBtn" class="btn" style="display:none; background: #10b981; color: white;" onclick="nextRoom()">ورود به درِ بعدی ➔</button>
    </div>

    <!-- مرحله پیروزی -->
    <div id="step-finish" class="step-panel">
        <div class="card" style="text-align: center;">
            <h2 style="color: #34d399; font-size: 1.5rem;">🎉 تبریک! شما موفق به فرار از تمام درها شدید!</h2>
            <div id="summaryReport" style="text-align: right; margin: 20px 0; font-size: 1.05rem; background: #27272a; padding: 15px; border-radius: 10px;"></div>
        </div>

        <div class="card">
            <h3>📊 پنل مدیریت معلم (ثبت نتایج)</h3>
            <div style="overflow-x: auto;">
                <table id="teacherTable">
                    <thead>
                        <tr>
                            <th>نام کارآگاه</th>
                            <th>کلاس</th>
                            <th>تعداد تلاش‌ها</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn" style="background: #52525b; color: white; margin-top:20px;" onclick="resetGame()">شروع مجدد 🔄</button>
        </div>
    </div>
</div>

<script>
    const rooms = [
        {
            title: "🚪 درِ اول: دیوار آجری (راهبرد رسم شکل)",
            desc: "برای رسیدن به کلید، باید از یک دیوار ۵ متری بالا بروید. مورچه‌ای در هر ثانیه ۲ متر بالا می‌آید اما ۱ متر سر می‌خورد و پایین می‌آید. این مورچه در ثانیه چندم به بالای دیوار می‌رسد؟",
            options: ["ثانیه سوم (۳)", "ثانیه چهارم (۴)", "ثانیه پنجم (۵)", "ثانیه ششم (۶)"],
            correctIndex: 1, // گزینه دوم (ثانیه چهارم)
            hint: "راهنمایی: در ثانیه چهارم، مورچه ۲ متر بالا می‌آید و به لبه ۵ متری می‌رسد و دیگر سر نمی‌خورد!"
        },
        {
            title: "🚪 درِ دوم: کمد سفر (راهبرد الگوسازی)",
            desc: "شما برای سفر ۳ رنگ کلاه (قرمز، آبی، زرد) و ۲ مدل عینک (آفتابی، طبی) دارید. اگر بخواهید تمام حالت‌های مختلفِ پوشیدن کلاه و عینک را بدون تکرار بنویسید، چند حالت مختلف به دست می‌آید؟",
            options: ["۵ حالت", "۶ حالت", "۹ حالت", "۱۲ حالت"],
            correctIndex: 1, // گزینه دوم (۶ حالت)
            hint: "راهنمایی: تعداد کلاه‌ها را در تعداد عینک‌ها ضرب کنید (۳ × ۲)."
        },
        {
            title: "🚪 درِ سوم: گاوصندوق امنیتی (حذف حالت‌های نامطلوب)",
            desc: "رمز گاوصندوق یک عدد ۳ رقمی است: رقم صدگان فرد است، رقم دهگان بزرگ‌تر از ۷ است، مجموع سه رقم برابر ۱۰ می‌شود، و تمام رقم‌های آن با هم متفاوت هستند. رقم یکان گاوصندوق چند است؟",
            options: ["رقم ۱", "رقم ۲", "رقم ۵", "رقم صفر (۰)"],
            correctIndex: 3, // گزینه چهارم (صفر)
            hint: "راهنمایی: صدگان ۱ و دهگان ۹ باشد، مجموع می‌شود ۱۰ و یکان باید ۰ باشد (عدد ۱۹۰)."
        },
        {
            title: "🚪 درِ چهارم: قلک جادویی (راهبرد الگویابی)",
            desc: "شما روز اول ۵ هزار تومان، روز دوم ۱۰ هزار تومان، روز سوم ۱۵ هزار تومان و... در قلک می‌اندازید. در مجموع تا پایان روز چهارم، چند هزار تومان پول توی قلک جمع کرده‌اید؟",
            options: ["۳۰ هزار تومان", "۴0 هزار تومان", "۵۰ هزار تومان", "۶۰ هزار تومان"],
            correctIndex: 2, // گزینه سوم (۵۰ هزار تومان)
            hint: "راهنمایی: پول هر ۴ روز را با هم جمع کنید: (۵ + ۱۰ + ۱۵ + ۲۰)."
        }
    ];

    let currentRoom = 0, totalAttempts = 0;
    let student = { name: '', className: '' };

    function startGame() {
        const name = document.getElementById('studentName').value.trim();
        const cls = document.getElementById('className').value.trim();
        if (!name || !cls) { alert('لطفاً نام و کلاس خود را وارد کنید!'); return; }
        student.name = name; student.className = cls;
        document.getElementById('step-auth').classList.remove('active');
        document.getElementById('step-game').classList.add('active');
        loadRoom();
    }

    function loadRoom() {
        const r = rooms[currentRoom];
        document.getElementById('roomTitle').innerText = r.title;
        document.getElementById('roomDesc').innerText = r.desc;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        
        // ساخت کارت‌های گزینه‌ها به صورت گرافیکی
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        
        r.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index);
            container.appendChild(btn);
        });

        document.getElementById('progressFill').style.width = (currentRoom / rooms.length) * 100 + '%';
    }

    function checkAnswer(selectedIndex) {
        const r = rooms[currentRoom];
        const fb = document.getElementById('feedback');
        totalAttempts++;

        if (selectedIndex === r.correctIndex) {
            fb.className = 'feedback success';
            fb.innerText = '✨ آفرین! کلید درست بود و در باز شد.';
            fb.style.display = 'block';
            
            // غیرفعال کردن دکمه‌ها پس از پاسخ درست
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.disabled = true);
            
            document.getElementById('nextBtn').style.display = 'block';
        } else {
            fb.className = 'feedback error';
            fb.innerText = '❌ کلید اشتباه است! ' + r.hint;
            fb.style.display = 'block';
        }
    }

    function nextRoom() {
        currentRoom++;
        if (currentRoom < rooms.length) loadRoom();
        else finishGame();
    }

    function finishGame() {
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('step-game').classList.remove('active');
        document.getElementById('step-finish').classList.add('active');

        let data = JSON.parse(localStorage.getItem('escape_room_ch1') || '[]');
        data.push({ name: student.name, className: student.className, attempts: totalAttempts });
        localStorage.setItem('escape_room_ch1', JSON.stringify(data));

        document.getElementById('summaryReport').innerHTML = `
            <p><strong>👤 نام کارآگاه:</strong> ${student.name}</p>
            <p><strong>🏫 کلاس:</strong> ${student.className}</p>
            <p><strong>🎯 کل تلاش‌ها:</strong> ${totalAttempts} بار</p>
            <p><strong>🏅 درجه:</strong> استاد فرار از اتاق معماها</p>
        `;
        renderTable();
    }

    function renderTable() {
        let data = JSON.parse(localStorage.getItem('escape_room_ch1') || '[]');
        const tbody = document.querySelector('#teacherTable tbody');
        tbody.innerHTML = '';
        data.forEach(item => {
            tbody.innerHTML += `<tr><td>${item.name}</td><td>${item.className}</td><td>${item.attempts}</td><td><span style="color:#34d399; font-weight:bold;">فرار موفق 🏆</span></td></tr>`;
        });
    }

    function resetGame() {
        currentRoom = 0; totalAttempts = 0;
        document.getElementById('step-finish').classList.remove('active');
        document.getElementById('step-auth').classList.add('active');
        document.getElementById('studentName').value = '';
        document.getElementById('className').value = '';
        document.getElementById('progressFill').style.width = '0%';
    }
</script>

</body>
</html>
